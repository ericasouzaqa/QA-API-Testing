<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do Zero à Automação de API — Postman + Cypress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14181C;--surface:#1C2228;--surface-raised:#232A31;--line:#333B43;
    --text:#E8E6DF;--text-dim:#9AA3AB;
    --amber:#D4A537;--amber-dim:#3A331E;
    --teal:#4A7A6F;--teal-dim:#1E2C29;
    --brick:#B65C4A;--brick-dim:#31201C;
    --violet:#7C6FA8;--violet-dim:#241F35;
    --blue:#3A6FA8;--blue-dim:#1A2535;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:transparent;color:var(--text);height:100%;}
  body{font-family:'IBM Plex Sans',sans-serif;font-size:14px;line-height:1.6;}
  .shell{display:flex;flex-direction:column;min-height:100%;}
  .app{display:grid;grid-template-columns:300px 1fr;gap:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:1;}
  body.standalone{background:radial-gradient(circle at 15% 10%,#1c232b,var(--bg) 55%);min-height:100vh;}
  body.standalone .shell{min-height:100vh;max-width:1280px;margin:0 auto;padding:28px 20px;}
  body.standalone .app{min-height:calc(100vh - 56px);box-shadow:0 30px 80px rgba(0,0,0,.45);}
  @media(max-width:820px){
    body.standalone .shell{padding:0;}
    body.standalone .app{min-height:100vh;border-radius:0;border:none;}
    .app{grid-template-columns:1fr;}
    .sidebar{max-height:300px;border-right:none!important;border-bottom:1px solid var(--line);}
  }
  /* SIDEBAR */
  .sidebar{background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column;flex-shrink:0;}
  .brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;padding:16px 14px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2;}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none;}
  .brand .gear{margin-left:auto;background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:15px;padding:2px;line-height:1;}
  .brand .gear:hover{color:var(--text);}
  .overall-progress{padding:11px 14px;border-bottom:1px solid var(--line);}
  .overall-progress .lbl{font-size:11px;color:var(--text-dim);display:flex;justify-content:space-between;margin-bottom:5px;}
  .bar{height:5px;border-radius:4px;background:var(--surface-raised);overflow:hidden;}
  .bar-fill{height:100%;background:var(--amber);transition:width .3s ease;}
  .btn-continue{width:100%;margin-top:9px;}
  .module{border-bottom:1px solid var(--line);}
  .module-head{padding:11px 14px;display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;}
  .module-head:hover{background:var(--surface-raised);}
  .module-head b{font-size:12px;font-weight:600;flex:1;line-height:1.35;}
  .module-head .cnt{font-size:10px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
  .module-head .chev{color:var(--text-dim);font-size:9px;transition:transform .15s;flex:none;}
  .module.open .chev{transform:rotate(90deg);}
  .mod-bar{height:2px;background:var(--surface-raised);margin:0 14px 6px;border-radius:2px;overflow:hidden;}
  .mod-bar-fill{height:100%;background:var(--teal);}
  .lesson-list{display:none;padding-bottom:6px;}
  .module.open .lesson-list{display:block;}
  .lesson-item{display:flex;align-items:center;gap:7px;padding:6px 14px 6px 24px;cursor:pointer;font-size:12px;color:var(--text-dim);}
  .lesson-item:hover{background:var(--surface-raised);color:var(--text);}
  .lesson-item.active{background:var(--amber-dim);color:var(--amber);}
  .lesson-item.new-topic .ltitle::before{content:'🆕 ';font-size:10px;}
  .lesson-item .chk{width:13px;height:13px;border-radius:3px;border:1.5px solid var(--text-dim);flex:none;display:flex;align-items:center;justify-content:center;font-size:8px;}
  .lesson-item.done .chk{background:var(--teal);border-color:var(--teal);color:#0d1512;}
  .lesson-item .ltitle{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* MAIN */
  .main{padding:26px 32px;overflow-y:auto;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:20px;margin:0 0 4px;font-weight:700;}
  h2{font-family:'Space Grotesk',sans-serif;font-size:16px;margin:20px 0 10px;font-weight:600;}
  .subtitle{color:var(--text-dim);font-size:13px;margin-bottom:18px;}
  .lesson-header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
  .badge{font-size:11px;color:var(--text-dim);border:1px solid var(--line);border-radius:12px;padding:3px 10px;}
  .badge.new{border-color:var(--violet);color:var(--violet);}
  /* BUTTONS */
  button{font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:13px;padding:9px 16px;border-radius:6px;border:1px solid var(--line);background:var(--surface-raised);color:var(--text);cursor:pointer;transition:border-color .15s,background .15s;}
  button:hover{border-color:var(--text-dim);}
  button:disabled{opacity:.4;cursor:not-allowed;}
  button.primary{background:var(--amber);border-color:var(--amber);color:#1A1608;}
  button.primary:hover{background:#e0b247;}
  button.ghost{background:transparent;}
  button.small{padding:5px 11px;font-size:12px;}
  button.teal{background:var(--teal);border-color:var(--teal);color:#0d1512;}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center;}
  /* CARDS */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:13px;}
  .card h3{font-family:'Space Grotesk',sans-serif;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);margin:0 0 9px;display:flex;align-items:center;gap:7px;}
  .card p{margin:0;font-size:13.5px;}
  .card ul,.card ol{margin:0;padding-left:17px;}
  .card li{margin-bottom:5px;font-size:13.5px;}
  .card table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px;}
  .card th{text-align:left;color:var(--text-dim);font-weight:600;border-bottom:1px solid var(--line);padding:5px 8px;}
  .card td{padding:5px 8px;border-bottom:1px solid var(--line);}
  .card tr:last-child td{border-bottom:none;}
  /* CODE */
  .code-wrap{background:#10151A;border:1px solid var(--line);border-radius:8px;margin-top:8px;overflow:hidden;}
  .code-title{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);}
  .code-label{font-size:10.5px;color:var(--text-dim);font-family:'IBM Plex Sans',sans-serif;text-transform:uppercase;letter-spacing:.06em;}
  .code-body{padding:13px 14px;font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-x:auto;color:var(--text);}
  /* CALLOUTS */
  .callout{border-radius:8px;padding:13px 15px;margin-bottom:13px;font-size:13px;}
  .callout h4{margin:0 0 7px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;font-family:'Space Grotesk',sans-serif;}
  .callout p{margin:0;}
  .callout ul{margin:0;padding-left:17px;}
  .callout li{margin-bottom:4px;}
  .callout.desafio{background:var(--violet-dim);border:1px solid var(--violet);}
  .callout.desafio h4{color:var(--violet);}
  .callout.teste{background:var(--teal-dim);border:1px solid var(--teal);}
  .callout.teste h4{color:var(--teal);}
  .callout.tip{background:var(--blue-dim);border:1px solid var(--blue);}
  .callout.tip h4{color:#6baed6;}
  /* CHECKLIST */
  .checklist-item{display:flex;align-items:flex-start;gap:9px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;}
  .checklist-item:last-child{border-bottom:none;}
  .checklist-item .box{width:14px;height:14px;border:1.5px solid var(--text-dim);border-radius:3px;flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:9px;}
  .checklist-item.checked .box{background:var(--teal);border-color:var(--teal);color:#0d1512;}
  .checklist-item.checked .txt{color:var(--text-dim);text-decoration:line-through;}
  /* NIVEL */
  .nivel-row{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;}
  .nivel-dot{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface-raised);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;}
  .nivel-dot.sel{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber-dim);}
  .nivel-lbl{font-size:11px;color:var(--text-dim);margin-top:5px;}
  /* INTRO */
  .intro-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px;}
  .intro-card h3{font-family:'Space Grotesk',sans-serif;font-size:13.5px;margin:0 0 7px;}
  .intro-card p{margin:0 0 7px;font-size:13px;color:var(--text-dim);}
  .api-pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface-raised);border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:11.5px;font-family:'IBM Plex Mono',monospace;margin:2px 5px 2px 0;}
  .tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600;margin-left:6px;vertical-align:middle;}
  .tag.novo{background:var(--violet-dim);color:var(--violet);border:1px solid var(--violet);}
  /* MISC */
  .loading{display:flex;align-items:center;gap:9px;color:var(--text-dim);font-size:13px;padding:14px 0;}
  .spinner{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .error-box{background:var(--brick-dim);border:1px solid var(--brick);color:var(--text);border-radius:8px;padding:13px 15px;font-size:13px;margin-bottom:13px;}
  .hidden{display:none!important;}
  .footer-note{text-align:center;font-size:11px;color:var(--text-dim);padding:12px 6px 4px;}
  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;}
  .modal-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;max-width:480px;width:100%;}
  .modal-card h2{font-family:'Space Grotesk',sans-serif;font-size:16px;margin:0 0 6px;}
  .modal-card input[type=password]{width:100%;background:#10151A;border:1px solid var(--line);border-radius:6px;color:var(--text);padding:10px 12px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;margin:10px 0;}
  .modal-note{font-size:11.5px;color:var(--text-dim);line-height:1.5;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:13px;}
</style>
</head>
<body>
<div class="shell">
<div class="app">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="brand">
      <span class="dot"></span>Zero → Automação de API
      <button class="gear" id="btn-settings">⚙️</button>
    </div>
    <div class="overall-progress">
      <div class="lbl"><span>Progresso</span><span id="overall-label">0/0</span></div>
      <div class="bar"><div class="bar-fill" id="overall-bar" style="width:0%"></div></div>
      <button class="small primary btn-continue" id="btn-continuar">Continuar de onde parei →</button>
    </div>
    <div id="modules-list"></div>
  </div>
  <!-- MAIN -->
  <div class="main">
    <div id="content-area"></div>
  </div>
</div>
<div class="footer-note">Progresso salvo neste navegador · Chamadas de IA direto para api.anthropic.com · Nenhum sistema interno conectado</div>
</div>

<script>
// ─────────────────────────────────────────
// CURRÍCULO — 7 módulos, 52 aulas
// Módulo 2.5 = "Leitura de documentação" — NOVO
// ─────────────────────────────────────────
const CURRICULO = [
  { id:'m1', titulo:'Fundamentos de API e HTTP', licoes:[

    {id:'m25-l2',titulo:'Anatomia de um endpoint documentado',desc:'Decompondo cada parte de um endpoint documentado: método, URL base, path, parâmetros, headers obrigatórios, body esperado, resposta de sucesso e de erro.',novo:true},

    {id:'m25-l8',titulo:'De documentação para caso de teste — passo a passo',desc:'Como transformar o que você leu na documentação em cenário de teste: extraindo regras, identificando o que validar, montando a matriz.',novo:true},
    {id:'m25-l9',titulo:'O que substituir em um script — identificando placeholders',desc:'Como ler um script de teste pronto e saber exatamente o que você precisa substituir, onde buscar esse valor, e o que acontece se você não substituir.',novo:true},

  ]},
  { id:'m3', titulo:'Postman — do zero à suíte profissional', licoes:[

const NIVEIS = ['Não conheço','Reconheço o conceito','Consigo fazer com orientação','Consigo fazer sozinho','Consigo explicar para outra pessoa','Consigo resolver um problema novo'];
const NIVEL_EMOJI = ['🟢','🔵','🟡','🟠','🔴','🟣'];

// ─── ESTADO ───────────────────────────────
const st = { activeLessonId:null, apiKey:'' };
function loadJ(k,fb){ try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch{return fb;} }
function saveJ(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch{} }
let progress = loadJ('apiqacurso_progress_v2',{});

// ─── API CLAUDE ───────────────────────────
const SYS_LESSON = `Você é um instrutor sênior de QA e Automação de Testes de API ensinando iniciantes do zero — com foco especial em interpretação real de documentação, Swagger, DTO, contratos e dados mockados.

APIs do projeto:
• Restful-Booker — https://restful-booker.herokuapp.com — docs em https://restful-booker.herokuapp.com/apidoc — auth via POST /auth (body: {"username":"admin","password":"password123"}), CRUD de reservas em /booking, health check em /ping
• DummyJSON — https://dummyjson.com — auth JWT via POST /auth/login, endpoints /products /users /todos /carts

Filosofia de ensino:
- Contexto antes da ferramenta: explique o problema que o conceito resolve ANTES do como.
- Para temas de documentação/Swagger/DTO: seja extremamente concreto, use trechos reais dos campos da Restful-Booker como exemplo.
- Não presuma conhecimento prévio. Explique todo termo técnico na primeira vez.
- Nunca invente endpoint ou campo que não exista nas APIs citadas.

Formato de resposta — JSON PURO, sem markdown, sem texto antes/depois:
{
  "objetivo": "1 frase — o que a pessoa conseguirá fazer ao fim desta aula",
  "conceito": "explicação simples, máx 4 frases",
  "analogia": "comparação cotidiana, 1-2 frases",
  "comoFunciona": "explicação técnica, máx 5 frases",
  "exemploTecnico": "exemplo real: código curto OU request/response concreto, máx 15 linhas",
  "exemploProfissional": "como isso aparece no mercado, 2-3 frases",
  "pratica": ["passo 1", "passo 2", "passo 3", "passo 4", "passo 5"],
  "teste": "como verificar se deu certo, 1-2 frases",
  "desafio": "exercício um pouco mais difícil que a prática, 3-4 frases",
  "resumo": "máx 2 frases",
  "checklist": ["item 1", "item 2", "item 3", "item 4", "item 5"]
}`;

async function callClaude(sys, user){
  const hdrs={"Content-Type":"application/json"};
  if(st.apiKey){ hdrs["x-api-key"]=st.apiKey; hdrs["anthropic-version"]="2023-06-01"; hdrs["anthropic-dangerous-direct-browser-access"]="true"; }
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:hdrs,
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,system:sys,messages:[{role:"user",content:user}]})
  });
  if(!res.ok){
    let d=''; try{const e=await res.json();d=e?.error?.message||'';}catch{}
    if((res.status===401||res.status===403)&&!st.apiKey) throw new Error("Não autorizado. Se esta página está fora do Claude (GitHub Pages), adicione sua chave de API em ⚙️.");
    throw new Error("Erro na API ("+res.status+")"+(d?": "+d:""));
  }
  const data=await res.json();
  const txt=data.content.map(b=>b.text||"").join("\n");
  const truncated=data.stop_reason==="max_tokens";
  try{ return xJson(txt); }catch(e){
    const err=new Error(truncated?"Resposta cortada por tamanho — tente de novo.":"Resposta fora do formato.");
    err.rawText=txt; throw err;
  }
}
function xJson(t){
  const c=t.replace(/```json/gi,"").replace(/```/g,"").trim();
  try{return JSON.parse(c);}catch{}
  const s=c.indexOf('{'),e=c.lastIndexOf('}');
  if(s!==-1&&e>s){ try{return JSON.parse(c.substring(s,e+1));}catch{} }
  throw new Error("no json");
}
function errBox(cid,err,fn){
  const b=document.getElementById(cid);
  const raw=err.rawText?`<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--text-dim)">ver resposta bruta</summary><pre style="white-space:pre-wrap;font-family:monospace;font-size:11px;color:var(--text-dim);margin-top:6px">${esc(err.rawText)}</pre></details>`:'';
  const rid='r-'+Math.random().toString(36).slice(2,7);
  b.innerHTML=`<div class="error-box">${esc(err.message)} — <button class="small" id="${rid}">Tentar de novo</button>${raw}</div>`;
  document.getElementById(rid).onclick=fn;
}

// ─── SIDEBAR ──────────────────────────────
let openMod=null;
function counts(){ let d=0,t=0; CURRICULO.forEach(m=>m.licoes.forEach(l=>{ t++; if(gp(l.id).done)d++; })); return{d,t}; }

function renderSidebar(){
  const{d,t}=counts();
  document.getElementById('overall-label').textContent=d+'/'+t;
  document.getElementById('overall-bar').style.width=(t?(d/t*100):0)+'%';
  const box=document.getElementById('modules-list');
  box.innerHTML=CURRICULO.map(m=>{
    const md=m.licoes.filter(l=>gp(l.id).done).length;
    const isOpen=m.id===openMod;
    return `<div class="module ${isOpen?'open':''}" data-mod="${m.id}">
      <div class="module-head" data-tog="${m.id}">
        <span class="chev">▶</span>
        <b>${esc(m.titulo)}${m.novo?'<span class="tag novo">NOVO</span>':''}</b>
        <span class="cnt">${md}/${m.licoes.length}</span>
      </div>
      <div class="mod-bar"><div class="mod-bar-fill" style="width:${m.licoes.length?(md/m.licoes.length*100):0}%"></div></div>
      <div class="lesson-list">
        ${m.licoes.map(l=>{
          const p=gp(l.id);
          return `<div class="lesson-item ${p.done?'done':''} ${st.activeLessonId===l.id?'active':''} ${l.novo?'new-topic':''}" data-les="${l.id}">
            <span class="chk">${p.done?'✓':''}</span><span class="ltitle">${esc(l.titulo)}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
  box.querySelectorAll('[data-tog]').forEach(el=>el.addEventListener('click',()=>{ openMod=(openMod===el.dataset.tog)?null:el.dataset.tog; renderSidebar(); }));
  box.querySelectorAll('[data-les]').forEach(el=>el.addEventListener('click',()=>openLesson(el.dataset.les)));
}

document.getElementById('btn-continuar').addEventListener('click',()=>{
  const al=allLessons(); const nx=al.find(l=>!gp(l.id).done)||al[0];
  if(nx){ openMod=nx.moduloId; openLesson(nx.id); }
});

// ─── AULA ─────────────────────────────────
async function openLesson(id){
  st.activeLessonId=id;
  const les=allLessons().find(l=>l.id===id); if(!les)return;
  renderSidebar();
  const area=document.getElementById('content-area');
  area.innerHTML=`
    <div class="lesson-header">
      <span class="badge ${les.moduloNovo||les.novo?'new':''}">${esc(les.moduloTitulo)}</span>
      ${les.novo?'<span class="badge new">Aula nova</span>':''}
    </div>
    <h1>${esc(les.titulo)}</h1>
    <div class="subtitle">${esc(les.desc)}</div>
    <div id="lesson-body"></div>`;

  if(!cache[id]){
    document.getElementById('lesson-body').innerHTML='<div class="loading"><div class="spinner"></div>Preparando esta aula...</div>';
    try{
      const prompt=`Módulo: ${les.moduloTitulo}\nAula: ${les.titulo}\nContexto: ${les.desc}\n\nGere o conteúdo.`;
      cache[id]=await callClaude(SYS_LESSON,prompt); sc();
    }catch(e){ errBox('lesson-body',e,()=>openLesson(id)); return; }
  }
  renderBody(les,cache[id]);
}

function codeWrap(title,code){
  const cid='copy-'+Math.random().toString(36).slice(2,6);
  return `<div class="code-wrap"><div class="code-title"><span class="code-label">${esc(title)}</span><button class="small" id="${cid}">copiar</button></div><div class="code-body">${esc(code)}</div></div>`;
}

function renderBody(les,c){
  const box=document.getElementById('lesson-body'); if(!box)return;
  const p=gp(les.id); let html='';
  html+=`<div class="card"><h3>🎯 Objetivo</h3><p>${esc(c.objetivo)}</p></div>`;
  html+=`<div class="card"><h3>🧠 Conceito</h3><p>${esc(c.conceito)}</p></div>`;
  if(c.analogia) html+=`<div class="card"><h3>🌎 Comparação com o mundo real</h3><p>${esc(c.analogia)}</p></div>`;
  html+=`<div class="card"><h3>🔎 Como funciona</h3><p>${esc(c.comoFunciona)}</p></div>`;
  if(c.exemploTecnico) html+=`<div class="card"><h3>💻 Exemplo técnico</h3>${codeWrap('exemplo',c.exemploTecnico)}</div>`;
  if(c.exemploProfissional) html+=`<div class="card"><h3>🏢 No mundo real</h3><p>${esc(c.exemploProfissional)}</p></div>`;
  if(c.pratica&&c.pratica.length) html+=`<div class="card"><h3>🛠️ Prática — passo a passo</h3><ol>${c.pratica.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`;
  if(c.teste) html+=`<div class="callout teste"><h4>🔬 Como testar se deu certo</h4><p>${esc(c.teste)}</p></div>`;
  if(c.desafio) html+=`<div class="callout desafio"><h4>🧩 Desafio</h4><p>${esc(c.desafio)}</p></div>`;
  if(c.resumo) html+=`<div class="card"><h3>📝 Resumo</h3><p>${esc(c.resumo)}</p></div>`;
  if(c.checklist&&c.checklist.length){
    html+=`<div class="card"><h3>✅ Checklist de autoavaliação</h3>`;
    c.checklist.forEach((item,i)=>{ const ck=!!p.checklist[i]; html+=`<div class="checklist-item ${ck?'checked':''}" data-ci="${i}"><div class="box">${ck?'✓':''}</div><span class="txt">${esc(item)}</span></div>`; });
    html+=`</div>`;
  }
  html+=`<div class="card"><h3>Seu nível nesta aula</h3>
    <div class="nivel-row">${NIVEL_EMOJI.map((e,i)=>`<button class="nivel-dot ${p.nivel===i?'sel':''}" data-nv="${i}">${e}</button>`).join('')}</div>
    <div class="nivel-lbl">${NIVEIS[p.nivel]}</div></div>`;
  html+=`<div class="row">
    <button class="${p.done?'teal':'primary'}" id="btn-done">${p.done?'✓ Concluída':'Marcar como concluída'}</button>
    <button class="ghost small" id="btn-regen">Gerar de novo</button>
  </div>`;
  box.innerHTML=html;

  box.querySelectorAll('[data-ci]').forEach(el=>el.addEventListener('click',()=>{ const i=+el.dataset.ci; p.checklist[i]=!p.checklist[i]; sp(); renderBody(les,c); }));
  box.querySelectorAll('[data-nv]').forEach(el=>el.addEventListener('click',()=>{ p.nivel=+el.dataset.nv; sp(); renderBody(les,c); }));
  document.getElementById('btn-done').addEventListener('click',()=>{ p.done=!p.done; sp(); renderSidebar(); renderBody(les,c); });
  document.getElementById('btn-regen').addEventListener('click',async()=>{ delete cache[les.id]; sc(); await openLesson(les.id); });

  box.querySelectorAll('.code-wrap button.small').forEach(btn=>{
    btn.addEventListener('click',e=>{ const pre=e.currentTarget.closest('.code-wrap').querySelector('.code-body'); copyText(pre?pre.textContent:'',e.currentTarget); });
  });
}

// ─── COPY ─────────────────────────────────
function copyText(txt,btn){
  const orig=btn?btn.textContent:null;
  const fb=ok=>{ if(!btn)return; btn.textContent=ok?'✓':'ver abaixo'; setTimeout(()=>btn.textContent=orig,1800); };
  if(navigator.clipboard?.writeText){ navigator.clipboard.writeText(txt).then(()=>fb(true)).catch(()=>{ if(!fbExec(txt)){fb(false);txtModal(txt);}else fb(true); }); }
  else{ if(!fbExec(txt)){fb(false);txtModal(txt);}else fb(true); }
}
function fbExec(t){ try{ const a=document.createElement('textarea'); a.value=t; a.style.cssText='position:fixed;left:-9999px'; document.body.appendChild(a); a.focus(); a.select(); const ok=document.execCommand('copy'); document.body.removeChild(a); return ok; }catch{return false;} }
function txtModal(txt){
  const o=document.createElement('div'); o.className='modal-overlay';
  o.innerHTML=`<div class="modal-card"><div class="modal-note" style="margin-bottom:8px">Cópia automática bloqueada — Ctrl+C aqui:</div><textarea readonly style="width:100%;min-height:140px;background:#10151A;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:10px;font-family:monospace;font-size:12px"></textarea><div class="modal-actions"><button class="small" id="cls-txt">fechar</button></div></div>`;
  document.body.appendChild(o);
  const ta=o.querySelector('textarea'); ta.value=txt; ta.focus(); ta.select();
  document.getElementById('cls-txt').onclick=()=>o.remove();
}
